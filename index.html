<title>The Ashfall Compact</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  The Ashfall Compact: The Deep Echo Library — a grimdark top-down action-RPG vertical slice.
  Plain JS, no build step. See GAME_SPEC.md for the design and ROADMAP.md for the milestone plan.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Deliberately dark-only: the whole slice happens underground. */
:root {
  --void: #070606;
  --well: #100d0c;
  --panel: #171311;
  --line: #3a3027;
  --text: #ddd3bd;
  --dim: #9a8c76;
  --ember: #e0702a;
  --display: "IM Fell English SC", Georgia, serif;
  --body: "EB Garamond", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--void);
  color: var(--text);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.5;
  padding: 16px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px));
}
#stage { position: relative; width: 100%; max-width: 1280px; margin: 0 auto; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); overflow: hidden; }
#view { display: block; width: 100%; height: 100%; image-rendering: auto; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }

/* Title and menus */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px;
  background: radial-gradient(60% 70% at 50% 60%, rgba(224,112,42,.10), transparent 70%), rgba(7,6,6,.86); }
.screen h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 6vw, 64px); letter-spacing: .04em; margin: 0; color: var(--text); }
.screen h2 { font-family: var(--display); font-weight: 400; font-size: clamp(16px, 2.4vw, 24px); margin: 0 0 12px; color: var(--ember); letter-spacing: .08em; }
.screen p { max-width: 46ch; color: var(--dim); margin: 0; }
.menu { display: flex; flex-direction: column; gap: 8px; min-width: 220px; }
button { font: inherit; font-family: var(--display); font-size: 18px; letter-spacing: .06em; color: var(--text); background: var(--panel); border: 1px solid var(--line); padding: 8px 18px; cursor: pointer; }
button:hover:not(:disabled), button:focus-visible { border-color: var(--ember); color: #fff; outline: none; }
button:disabled { opacity: .35; cursor: default; }
textarea { width: min(90%, 520px); height: 90px; background: var(--well); color: var(--text); border: 1px solid var(--line); font: 13px/1.4 ui-monospace, monospace; padding: 8px; }

/* Story text: paragraphs, never bullet points */
#say { position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%); width: min(92%, 760px); background: rgba(16,13,12,.94); border: 1px solid var(--line); border-top: 2px solid var(--ember);
  padding: 14px 20px 12px; font-size: clamp(14px, 1.9vw, 19px); }
#say .who { font-family: var(--display); color: var(--ember); letter-spacing: .06em; margin-bottom: 4px; }
#say p { margin: 0 0 .5em; }
#say .choices { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
#say .choices button { font-family: var(--body); font-size: .95em; letter-spacing: 0; text-align: left; background: var(--well); padding: 6px 12px; }
#say .choices button span { color: var(--ember); margin-right: 10px; font-family: var(--display); }
#say .choices button em { color: var(--dim); }
#say .seals { display: flex; gap: 8px; margin: 8px 0 12px; flex-wrap: wrap; }
#say .seal { flex: 1 1 120px; border: 1px solid var(--line); background: var(--well); padding: 4px 10px; min-height: 2.6em; color: var(--text); }
#say .seal span { display: block; font-family: var(--display); font-size: .75em; color: var(--dim); letter-spacing: .06em; }
#say .seal.lit { border-color: var(--ember); }
#say form { display: flex; gap: 8px; flex-wrap: wrap; }
#say input { flex: 1 1 180px; font: inherit; background: var(--well); color: var(--text); border: 1px solid var(--line); padding: 6px 10px; }
#say input:focus { outline: none; border-color: var(--ember); }
#say .more { text-align: right; font-size: .8em; color: var(--dim); }
.hint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 14px; color: var(--dim); pointer-events: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div id="stage">
  <canvas id="view"></canvas>
  <div id="ui"></div>
</div>

<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/script.js"></script>
<script src="js/render.js"></script>
<script src="js/world.js"></script>
<script src="js/dialogue.js"></script>
<script src="js/combat.js"></script>
<script src="js/scenes.js"></script>
<script src="js/ui.js"></script>
